<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade Portfolio - A Pokemon-Style Adventure</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="console-shell">
        <div id="screen-frame">
            <div id="game-container">
                <canvas id="gameCanvas" width="720" height="480"></canvas>

                <!-- HUD -->
                <div id="hud">
                    <div id="hud-projects">PROJECTS <span id="projects-collected">0</span>/<span id="total-projects">5</span></div>
                </div>

                <!-- Pokemon-style dialogue box -->
                <div id="dialogue-box" class="hidden">
                    <p id="dialogue-text"></p>
                    <span id="dialogue-arrow" class="hidden">&#9660;</span>
                </div>

                <!-- Start Screen -->
                <div id="start-screen">
                    <h1>ARCADE<br>PORTFOLIO</h1>
                    <p class="subtitle">A Pokemon-style portfolio adventure</p>
                    <button id="start-btn" class="pixel-btn">PRESS START</button>
                    <div class="instructions">
                        <p><span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span> MOVE &nbsp;&nbsp; <span class="key">E</span> INTERACT</p>
                        <p class="fine-print">Talk to the townsfolk. Read the signs.<br>Wild PROJECTS lurk in the tall grass...</p>
                    </div>
                </div>
            </div>
        </div>
        <div id="controls-hint">WASD to move &middot; E to interact</div>
    </div>

    <script src="game.js"></script>
</body>
</html>
