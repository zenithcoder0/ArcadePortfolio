<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Arcade Portfolio - A Pokemon-Style Adventure</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=3">
</head>
<body>
    <div id="console-shell">
        <div id="screen-frame">
            <div id="game-container">
                <canvas id="gameCanvas" width="720" height="480"></canvas>

                <!-- HUD -->
                <div id="hud">
                    <div class="hud-box">NOTES <span id="notes-collected">0</span>/<span id="total-notes">5</span></div>
                    <div class="hud-box">HP <span id="hp-current">20</span>/<span id="hp-max">20</span></div>
                </div>

                <!-- Pokemon-style dialogue box -->
                <div id="dialogue-box" class="hidden">
                    <p id="dialogue-text"></p>
                    <span id="dialogue-arrow" class="hidden">&#9660;</span>
                </div>

                <!-- RPG battle menu (2x2, Pokemon style) -->
                <div id="battle-menu" class="hidden">
                    <div class="battle-option" id="bm-0">DEBUG</div>
                    <div class="battle-option" id="bm-1">REFACTOR</div>
                    <div class="battle-option" id="bm-2">COFFEE</div>
                    <div class="battle-option" id="bm-3">RUN</div>
                </div>

                <!-- Start Screen -->
                <div id="start-screen">
                    <h1>ARCADE<br>PORTFOLIO</h1>
                    <p class="subtitle">A Pokemon-style portfolio adventure</p>
                    <button id="start-btn" class="pixel-btn">PRESS START</button>
                    <div class="instructions">
                        <p><span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span> MOVE &nbsp;&nbsp; <span class="key">E</span> INTERACT</p>
                        <p class="fine-print">Collect the 5 NOTES lying on the ground.<br>Beware: wild BOTS lurk in the tall grass.<br>Turn your notes in at the INBOX basket!</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- On-screen Game Boy controller (touch devices) -->
        <div id="touch-controls">
            <div id="dpad">
                <div class="dpad-spacer"></div>
                <button class="dpad-btn" data-key="KeyW" aria-label="Up">&#9650;</button>
                <div class="dpad-spacer"></div>
                <button class="dpad-btn" data-key="KeyA" aria-label="Left">&#9664;</button>
                <div class="dpad-center"></div>
                <button class="dpad-btn" data-key="KeyD" aria-label="Right">&#9654;</button>
                <div class="dpad-spacer"></div>
                <button class="dpad-btn" data-key="KeyS" aria-label="Down">&#9660;</button>
                <div class="dpad-spacer"></div>
            </div>
            <div id="action-buttons">
                <button class="ab-btn" id="btn-b" data-key="KeyX" aria-label="B">B</button>
                <button class="ab-btn" id="btn-a" data-key="KeyE" aria-label="A">A</button>
            </div>
        </div>

        <div id="controls-hint">WASD to move &middot; E to interact</div>
    </div>

    <script src="game.js?v=3"></script>
</body>
</html>
